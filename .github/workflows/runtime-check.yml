name: AEGIS runtime sanity checks
on:
  push:
    branches: [main, fix/blackout-v441-runtime]
  pull_request:
    branches: [main]
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse runtime modules
        run: |
          node --check llm/webllm_bridge.js
          node --check sw.js
      - name: Enforce release changelog and README alignment
        run: node tests/release-metadata.cjs
      - name: Verify all bundled bushcraft illustrations
        run: node tests/bushcraft-visuals.cjs
      - name: Verify offline manual retrieval and prompt budgets
        run: node tests/fm-retrieval.cjs
      - name: Verify field readiness and unit preservation
        run: node tests/field-ready.cjs
      - name: Verify guided installation lifecycle
        run: node tests/install-guide.cjs
      - name: Verify household coverage and backup validation
        run: node tests/household.cjs
      - name: Verify referenced offline assets and iOS settings
        run: node tests/runtime-sanity.cjs
      - name: Verify packaged model download and shell persistence
        run: |
          node tests/download-recovery.cjs
          node tests/shell-persistence.cjs
      - name: Verify Community Chat, notifications and language rules
        run: |
          node --check community-chat-v52.js
          node --check community-filter-v52.js
          node --check supabase/functions/aegis-community/index.ts
          node tests/community-filter.cjs
          node tests/community-api.cjs
          node tests/community-client.cjs
          node tests/community-notifications.cjs
